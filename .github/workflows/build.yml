name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MSYS2 (MINGW32)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            make flex bison perl sed gawk diffutils
            mingw-w64-i686-gcc mingw-w64-i686-binutils
            mingw-w64-i686-winpthreads mingw-w64-i686-zlib

      - name: Compilar
        shell: pwsh
        run: |
          ./winbuild/build.ps1 -Msys2Root '${{ steps.msys2.outputs.msys2-location }}'

      - name: Log de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: winbuild/out/*.log

      - name: Binarios
        uses: actions/upload-artifact@v4
        with:
          name: xming-win32
          path: dist/
